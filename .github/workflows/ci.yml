# Lint, build, test and scan on every push to main and every pull request. Publishing is publish.yml's job.
# Actions are pinned to full commit SHAs and installs run no dependency scripts, as in publish.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tools/scan/package-lock.json

      - run: npm ci --ignore-scripts

      - run: npm ci --ignore-scripts --prefix tools/scan

      - name: Lint (n8n-node lint, the rules of n8n's scanner)
        run: npm run lint

      - name: Build and test
        run: npm test

      - name: n8n's verification scanner, local checks
        run: npm run scan
