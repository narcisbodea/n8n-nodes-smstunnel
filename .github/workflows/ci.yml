# Lint, build and test on every push to main and every pull request. Publishing is publish.yml's job.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Lint (n8n-node lint, the rules of n8n's scanner)
        run: npm run lint

      - name: Build and test
        run: npm test
