# Publishes n8n-nodes-smstunnel to npm, with npm provenance, when a GitHub release is published.
#
# n8n verifies a community node only when it was published from GitHub Actions with a provenance statement
# (https://docs.n8n.io/integrations/creating-nodes/deploy/submit-community-nodes/). This workflow uses npm Trusted
# Publishing (OIDC): no npm token is stored anywhere (https://docs.npmjs.com/trusted-publishers).
#
# Two jobs:
# - build (read-only): checks the release, installs, lints, builds, tests and packs the .tgz, which it hands on as
#   an artifact. It can't publish: it has no id-token.
# - publish (GitHub environment "npm", which waits for the owner's approval): downloads that .tgz and publishes it,
#   nothing else: no checkout, no install, no build, no package scripts. npm signs the provenance with this run's
#   repository, commit and workflow (the same for both jobs) and the .tgz's own sha512.
#
# One-time setup (PUBLISHING.md):
# - GitHub → Settings → Environments → "npm": required reviewer (the owner), deployment tags "v*".
# - npmjs.com → n8n-nodes-smstunnel → Settings → Trusted Publisher → GitHub Actions: user "narcisbodea", repository
#   "n8n-nodes-smstunnel", workflow "publish.yml", environment "npm", allowed action "npm publish".
#
# A release: set "version" in package.json and add it to CHANGELOG.md, merge to main, then publish a GitHub release
# from main whose tag is "v" + that version (v1.2.0). A pre-release is not published.
#
# Every action is pinned to a full commit SHA (looked up with git ls-remote and checked with the GitHub API).

name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  build:
    name: Check, build, test and pack
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - name: Check out the release tag, with the history of main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          # No dependency cache in a release build.
          package-manager-cache: false

      - name: Release gate (tag = v + package.json version, commit on main)
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::The release tag $TAG is not v$VERSION, the version in package.json."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::The tag $TAG no longer points at the commit this release was made from ($GITHUB_SHA)."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The commit of $TAG is not on main. Release from main."
            exit 1
          fi

      # --ignore-scripts: no dependency runs code at install. None needs to: the only install scripts in the tree are
      # native add-ons (isolated-vm, ssh2, cpu-features) under @n8n/node-cli's AI packages, which build, lint and
      # tests never load, and eslint-plugin-n8n-nodes-base's preinstall, `npx only-allow pnpm`, which would fetch code.
      - name: Install
        run: npm ci --ignore-scripts

      # The scanner lives apart in tools/scan, pinned with its integrity by tools/scan/package-lock.json (as a
      # dependency of the package its TypeScript 6 would take over node_modules/.bin/tsc).
      - name: Install n8n's scanner
        run: npm ci --ignore-scripts --prefix tools/scan

      - name: Lint (n8n-node lint, the rules of n8n's scanner)
        run: npm run lint

      - name: Build and test
        run: npm test

      # Pack and publish run with --ignore-scripts, so prepublishOnly (n8n-node prerelease) never runs here. It checks
      # nothing itself: it only refuses an npm publish made outside n8n-node release, whose real checks are the lint
      # and build above and n8n's scanner here (its local checks: the source and the files to publish).
      - name: n8n's verification scanner, local checks
        run: npm run scan

      - name: Pack
        id: pack
        run: |
          TARBALL="$(npm pack --ignore-scripts --json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].filename")"
          sha256sum "$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      # The files of n8n.nodes and n8n.credentials, their icons and codex, README, LICENSE and package.json are in;
      # nothing else is (no tests, sources, .env, maps); the version is the tag's; no runtime dependencies.
      - name: Check the package
        env:
          TAG: ${{ github.event.release.tag_name }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node scripts/check-package.mjs "$TARBALL" "$TAG"

      - name: Hand the package to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm with provenance
    needs: build
    runs-on: ubuntu-latest
    # Waits for the owner's approval (required reviewer); only tags v* may deploy to it.
    environment: npm
    permissions:
      contents: read
      # The OIDC token for npm Trusted Publishing and for the provenance statement.
      id-token: write
    steps:
      - name: Get the package from the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package
          digest-mismatch: error

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Exactly npm 11.21.1 (Trusted Publishing needs 11.5.1 or later), checked against its sha512 before it is
      # installed: npm's tarball bundles its dependencies, so nothing else is fetched.
      - name: npm 11.21.1, checked against its pinned sha512
        env:
          NPM_INTEGRITY: sha512-YTzL6QBEJXyHcTu0JiUc7RKMp+mzlJtl7rGLmERaXUQeFHIMc9atdr6G9M9C8vDWbv40epoTQAzNL2/PtZVDhQ==
        run: |
          cd "$RUNNER_TEMP"
          npm pack npm@11.21.1 --silent > /dev/null
          node -e "const c=require('crypto'),f=require('fs'); const got='sha512-'+c.createHash('sha512').update(f.readFileSync('npm-11.21.1.tgz')).digest('base64'); if (got!==process.env.NPM_INTEGRITY) { console.error('::error::npm-11.21.1.tgz is not the pinned npm 11.21.1'); process.exit(1); }"
          npm install --global ./npm-11.21.1.tgz --ignore-scripts
          npm --version

      # "./" is needed: npm reads "package/<file>.tgz" as a GitHub shorthand (user/repo) and runs git ls-remote
      # on github.com/package/<file>.tgz instead of publishing the file.
      - name: Publish
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: npm publish "./package/$TARBALL" --provenance --access public --ignore-scripts
